name: Deploy to Chabokan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let a running deployment finish before uploading another version.
concurrency:
  group: chabokan-production
  cancel-in-progress: false

jobs:
  deploy:
    # Enable only after the target service, persistent path, and secrets are ready.
    if: github.event_name == 'workflow_dispatch' || vars.CHABOKAN_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHABOKAN_SERVICE: ${{ vars.CHABOKAN_SERVICE || 'next-xxg05v' }}
      CHABOKAN_ORIGIN: ${{ vars.CHABOKAN_ORIGIN }}
      CHABOK_NO_UPDATE_CHECK: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check deployment configuration
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          test -n "$CHABOKAN_TOKEN" || { echo '::error::Set the CHABOKAN_TOKEN repository secret.'; exit 1; }
          test -n "$CHABOKAN_SERVICE" || { echo '::error::Set the CHABOKAN_SERVICE repository variable to the service name.'; exit 1; }
          node --input-type=module -e 'const value = process.env.CHABOKAN_ORIGIN; const url = new URL(value); if (url.protocol !== "https:" || url.origin !== value || url.username || url.password) throw new Error("CHABOKAN_ORIGIN must be an HTTPS origin without a path or trailing slash");'

      - name: Install dependencies
        run: npm ci --include=dev --include=optional

      - name: Verify production build
        run: npm run build

      - name: Check types and calculators
        run: |
          npm run typecheck
          npm run test:calculator

      - name: Verify SQLite integration in an isolated test database
        env:
          PADASH_TEST_STORAGE: sqlite
        run: npm run test:integration

      - name: Install the Chabokan CLI
        run: npm install --global @chabokan.net/cli@0.9.1

      - name: Deploy source to Chabokan
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          chabok login --token "$CHABOKAN_TOKEN"
          chabok deploy --service "$CHABOKAN_SERVICE"

      - name: Verify deployed service
        run: node scripts/check-deployment.mjs "$CHABOKAN_ORIGIN"
